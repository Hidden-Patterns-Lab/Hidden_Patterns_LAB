<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Hidden Patterns Lab</title>

  <meta
    name="description"
    content="Hidden Patterns Lab — Data, Patterns, Insights. Coming Soon."
  />

  <style>
    :root {
      --background: #f7f4ef;
      --navy: #0b1f33;
      --muted-text: #66717c;
      --accent: #b08a57;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;

      padding: 32px 20px;

      background:
        radial-gradient(
          circle at top,
          rgba(176, 138, 87, 0.08),
          transparent 38%
        ),
        var(--background);

      color: var(--navy);

      font-family:
        Inter,
        Pretendard,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    }

    .coming-soon {
      width: 100%;
      max-width: 720px;

      display: flex;
      flex-direction: column;
      align-items: center;

      text-align: center;
    }

    .logo {
      width: min(280px, 68vw);
      height: auto;

      display: block;

      margin-bottom: 36px;

      object-fit: contain;
    }

    .eyebrow {
      margin: 0 0 12px;

      color: var(--accent);

      font-size: 13px;
      font-weight: 700;
      letter-spacing: 0.24em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0;

      font-size: clamp(42px, 8vw, 76px);
      font-weight: 700;
      line-height: 1;
      letter-spacing: -0.04em;
    }

    .description {
      max-width: 560px;

      margin: 24px 0 0;

      color: var(--muted-text);

      font-size: clamp(15px, 2.4vw, 18px);
      line-height: 1.7;
    }

    .divider {
      width: 52px;
      height: 2px;

      margin: 30px 0;

      background: var(--accent);
      border: 0;
    }

    .slogan {
      margin: 0;

      color: var(--navy);

      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .footer {
      position: fixed;
      left: 0;
      bottom: 18px;

      width: 100%;

      padding: 0 20px;

      color: rgba(11, 31, 51, 0.5);

      font-size: 12px;
      text-align: center;
    }

    @media (max-height: 650px) {
      .logo {
        width: 190px;
        margin-bottom: 24px;
      }

      .description {
        margin-top: 16px;
      }

      .divider {
        margin: 20px 0;
      }

      .footer {
        position: static;
        margin-top: 38px;
      }
    }
  </style>
</head>

<body>
  <main class="coming-soon">
    <img
      class="logo"
      src="./HPL coming soon.png"
      alt="Hidden Patterns Lab 로고"
    />

    <p class="eyebrow">Hidden Patterns Lab</p>

    <h1>Coming Soon</h1>

    <p class="description">
      데이터 속에 숨겨진 패턴을 발견하고,<br />
      더 나은 의사결정을 위한 인사이트를 제공합니다.
    </p>

    <hr class="divider" />

    <p class="slogan">
      Data · Patterns · Insights
    </p>
  </main>

  <footer class="footer">
    © 2026 Hidden Patterns Lab
  </footer>
</body>
</html>
